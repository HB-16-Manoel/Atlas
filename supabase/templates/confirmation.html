<!doctype html>
<html lang="en">
  <body style="margin:0;background:#11131d;color:#f4f6ff;font-family:Arial,sans-serif;padding:32px 16px">
    <div style="max-width:520px;margin:0 auto;background:#171a26;border:1px solid #2b3042;border-radius:18px;padding:32px">
      <p style="margin:0 0 24px;color:#7892ff;font-size:13px;font-weight:700;letter-spacing:.14em">ATLAS</p>
      <h1 style="margin:0 0 12px;font-size:24px">Confirm your Atlas account</h1>
      <p style="margin:0 0 24px;color:#aeb4c6;line-height:1.6">Confirm your email address to finish creating your Atlas account.</p>
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#5b7cff;color:#fff;text-decoration:none;font-weight:700;border-radius:10px;padding:13px 18px">Confirm email</a>
      <p style="margin:24px 0 0;color:#747b90;font-size:13px;line-height:1.6">If you didn’t create an Atlas account, you can ignore this email.</p>
    </div>
  </body>
</html>
