<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atlas Smart Scan — local prototype</title>
  <style>
    * { box-sizing: border-box; } body { font: 16px system-ui; background: #11131d; color: #f3f4fa; margin: 0; padding: 24px; }
    main { max-width: 1100px; margin: auto; } h1 { font-size: 26px; margin-bottom: 4px; } p { color: #bdc1d1; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 20px; margin-top: 24px; }
    .panel { border: 1px solid #34394b; border-radius: 12px; padding: 18px; min-width: 0; }
    img { display: block; max-width: 100%; max-height: 65vh; object-fit: contain; margin-top: 16px; }
    textarea { display: block; width: 100%; min-height: 370px; resize: vertical; background: #1b2033; color: #f5f6fb; border: 1px solid #4e566d; border-radius: 8px; padding: 14px; font: 16px/1.55 system-ui; }
    button, input { font: inherit; } button { margin-top: 14px; border: 0; border-radius: 8px; padding: 11px 16px; background: #5b7cff; color: #11131d; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .45; cursor: wait; } button.secondary { background: #293149; color: #fff; margin-left: 8px; }
    #status { min-height: 1.5em; } #status.error { color: #ff9e9e; }
  </style>
</head>
<body><main>
  <h1>Atlas Smart Scan</h1><p>Local research prototype. Review and correct every result before using the text in Journal. Nothing is saved to Atlas.</p>
  <div class="grid">
    <section class="panel"><h2>Original page</h2><label for="photo">Choose or photograph a handwritten page</label><br><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"><img id="preview" alt="Selected handwritten page" hidden></section>
    <section class="panel"><h2>Editable transcription</h2><label for="transcription">Review the wording and paragraph breaks</label><textarea id="transcription" placeholder="Select a photo, then scan it. You can edit the result here."></textarea>
      <button id="scan" type="button">Recognize handwriting</button><button id="download" class="secondary" type="button">Download text</button><p id="status" role="status" aria-live="polite"></p>
    </section>
  </div>
</main><script src="/app.js" defer></script></body></html>
